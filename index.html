<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="fluent-version" content="2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fluent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap">
<title>Fluent</title>
<style>
:root,[data-theme="dark"]{--bg:#131416;--s1:#1c1d20;--s2:#26272b;--s3:#323338;--line:#2e2f34;--text:#ededee;--muted:#8e8f96;--faint:#5f6067;--chalk:#f2f2ef;--onchalk:#131416;
  --good:#6fcf8e;--goodbg:#1d3326;--bad:#f07a7a;--badbg:#3a2224;--gold:#f2c94c;--fire:#ff9b4a;--blue:#7fb2ff;color-scheme:dark}
[data-theme="light"]{--bg:#f1f1f3;--s1:#ffffff;--s2:#f3f3f5;--s3:#e4e4e8;--line:#e0e0e5;--text:#17181a;--muted:#6d6e75;--faint:#a3a4ab;--chalk:#17181a;--onchalk:#ffffff;
  --good:#2f9e57;--goodbg:#e3f5e9;--bad:#d64b4b;--badbg:#fbe6e6;--gold:#d9a514;--fire:#f07b1d;--blue:#2f6fd6;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Outfit,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
.ic{display:block;flex:none}
.muted{color:var(--muted)}.small{font-size:13px}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px;border-radius:10px}
/* layout */
.shell{display:flex;min-height:100vh}
.side{display:none}
main{flex:1;min-width:0;max-width:600px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(110px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 16px 10px;margin:calc(-1 * (env(safe-area-inset-top) + 10px)) -16px 8px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.stat{display:flex;align-items:center;gap:6px;font-weight:800;font-size:16px;padding:6px 10px;border-radius:12px;cursor:pointer;border:0;background:transparent}
.stat.fire{color:var(--fire)}.stat.xp{color:var(--gold)}.stat.dim{color:var(--faint)}
.nav{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:20;pointer-events:none}
.nav-in{pointer-events:auto;width:min(560px,100%);height:66px;border-radius:24px;background:color-mix(in srgb,var(--s1) 92%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;box-shadow:0 20px 40px -22px rgba(0,0,0,.6)}
.nav-in button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--faint);cursor:pointer;padding:6px 6px;min-width:60px}
.nav-in button.on{color:var(--text)}
@media(min-width:900px){
  .nav{display:none}
  .side{display:flex;flex-direction:column;gap:4px;width:250px;flex:none;padding:26px 16px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh}
  .side .brand{display:flex;align-items:center;gap:10px;font-size:28px;font-weight:900;margin:0 8px 24px;letter-spacing:-.03em}
  .side button.nv{border:0;background:none;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;font-weight:700;color:var(--muted);cursor:pointer;text-align:left;font-size:16px}
  .side button.nv.on{background:var(--s2);color:var(--text)}
  main{max-width:760px;padding:24px 32px 60px}
  .topbar{margin:-24px -32px 10px;padding:16px 32px}
}
h1.title{font-size:30px;font-weight:900;letter-spacing:-.03em;margin:6px 2px 14px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px}
.sec h2{margin:0;font-size:19px;font-weight:800}
.sec button{border:0;background:none;color:var(--muted);font-weight:700;cursor:pointer;font-size:14px}
.btn{width:100%;border:0;border-radius:16px;padding:15px 16px;font-weight:800;font-size:16px;background:var(--chalk);color:var(--onchalk);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s;box-shadow:0 4px 0 color-mix(in srgb,var(--chalk) 55%,#000)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--chalk) 55%,#000)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.alt{background:var(--s2);color:var(--text);box-shadow:0 4px 0 var(--line)}
.btn.good{background:var(--good);color:#0f2416;box-shadow:0 4px 0 color-mix(in srgb,var(--good) 55%,#000)}
.btn.bad{background:var(--bad);color:#2a0f0f;box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 55%,#000)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted)}
.btn+.btn{margin-top:12px}
.row{display:flex;align-items:center;gap:12px}
.iconbtn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--s1);display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--s2);color:var(--muted)}
/* ruta de lecciones */
.unit{margin:6px 0 26px}
.unit-head{border-radius:22px;padding:16px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;background:var(--s1);border:1px solid var(--line)}
.unit-head .num{font-size:12.5px;font-weight:800;color:var(--muted)}
.unit-head h3{margin:2px 0 0;font-size:19px;font-weight:800;line-height:1.15}
.unit-head .lvl{margin-left:auto;font-size:12px;font-weight:800;padding:4px 9px;border-radius:9px;background:var(--s2);color:var(--muted)}
.unit-head.current{background:var(--chalk);color:var(--onchalk);border-color:var(--chalk)}
.unit-head.current .num{color:color-mix(in srgb,var(--onchalk) 60%,transparent)}
.unit-head.current .lvl{background:color-mix(in srgb,var(--onchalk) 12%,transparent);color:var(--onchalk)}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 0 4px}
.node{position:relative;width:74px;height:70px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;background:var(--s3);color:var(--faint);box-shadow:0 7px 0 color-mix(in srgb,var(--s3) 60%,#000);transition:transform .1s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 color-mix(in srgb,var(--s3) 60%,#000)}
.node.done{background:var(--gold);color:#3b2c00;box-shadow:0 7px 0 color-mix(in srgb,var(--gold) 55%,#000)}
.node.open{background:var(--chalk);color:var(--onchalk);box-shadow:0 7px 0 color-mix(in srgb,var(--chalk) 50%,#000)}
.node.open::after{content:'';position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--chalk);opacity:.5;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:.6}100%{transform:scale(1.18);opacity:0}}
.node .stars{position:absolute;bottom:-20px;display:flex;gap:1px;color:var(--gold)}
.node .tag{position:absolute;top:-28px;white-space:nowrap;background:var(--chalk);color:var(--onchalk);font-weight:800;font-size:12px;padding:5px 9px;border-radius:9px;animation:bob 1.6s ease-in-out infinite}
.node .tag::after{content:'';position:absolute;bottom:-5px;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--chalk);border-bottom:0}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.node.big{width:86px;height:80px;border-radius:26px}
.path-mascot{position:absolute;pointer-events:none}
/* hojas */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{width:100%;max-width:600px;max-height:92vh;overflow:auto;background:var(--s1);border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@media(min-width:900px){.overlay{align-items:center}.sheet{border-radius:26px}}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 14px}
.shead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.shead h3{margin:0;font-size:23px;font-weight:800;line-height:1.15}
.shead p{margin:5px 0 0;color:var(--muted);font-size:14px}
.x{width:38px;height:38px;border-radius:12px;border:0;background:var(--s2);color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none}
.tipbox{background:var(--s2);border-radius:16px;padding:14px;font-size:15px;line-height:1.5;margin:10px 0 14px}
.tipbox b{display:block;margin-bottom:4px}
/* player (lección a pantalla completa) */
.player{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}
.player.open{display:flex}
.p-top{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) 16px 8px;max-width:640px;width:100%;margin:0 auto}
.p-bar{flex:1;height:14px;border-radius:99px;background:var(--s3);overflow:hidden}
.p-bar i{display:block;height:100%;border-radius:99px;background:var(--good);transition:width .4s cubic-bezier(.3,1.2,.5,1);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.p-combo{font-weight:900;color:var(--fire);font-size:15px;min-width:34px;text-align:right}
.p-body{flex:1;overflow:auto;padding:12px 18px 20px;max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column}
.p-q{font-size:23px;font-weight:800;margin:6px 0 16px;line-height:1.2}
.p-prompt{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.bubble{position:relative;background:var(--s1);border:2px solid var(--line);border-radius:18px;padding:12px 15px;font-size:19px;font-weight:600;line-height:1.35}
.bubble .spk{display:inline-flex;vertical-align:-3px;margin-right:6px;color:var(--blue);cursor:pointer}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{border:2px solid var(--line);background:var(--s1);border-radius:16px;padding:15px 14px;font-weight:700;font-size:17px;cursor:pointer;text-align:left;box-shadow:0 4px 0 var(--line);transition:transform .08s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.sel{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--s1));box-shadow:0 4px 0 color-mix(in srgb,var(--blue) 60%,#000)}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt .k{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);font-size:12px;color:var(--muted);margin-right:10px}
.answer{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0 12px;margin-bottom:16px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{border:2px solid var(--line);background:var(--s1);border-radius:13px;padding:10px 13px;font-weight:700;font-size:17px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.tile.used{visibility:hidden}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair{border:2px solid var(--line);background:var(--s1);border-radius:14px;padding:14px 10px;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 3px 0 var(--line);min-height:56px}
.pair.sel{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--s1))}
.pair.ok{opacity:.25;pointer-events:none;border-color:var(--good)}
.pair.no{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.big-listen{display:flex;justify-content:center;gap:16px;margin:10px 0 22px}
.big-listen button{width:92px;height:92px;border-radius:24px;border:0;background:var(--blue);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 0 color-mix(in srgb,var(--blue) 55%,#000)}
.big-listen button.slow{width:68px;height:68px;align-self:flex-end;border-radius:20px}
.typein{width:100%;min-height:110px;border:2px solid var(--line);background:var(--s1);border-radius:16px;padding:14px;font-size:18px;resize:none;outline:none}
.typein:focus{border-color:var(--blue)}
.mic-xl{width:104px;height:104px;border-radius:50%;border:0;background:var(--blue);color:#fff;display:grid;place-items:center;margin:8px auto 10px;cursor:pointer;box-shadow:0 6px 0 color-mix(in srgb,var(--blue) 55%,#000);position:relative}
.mic-xl.rec{background:var(--bad);box-shadow:0 6px 0 color-mix(in srgb,var(--bad) 55%,#000)}
.mic-xl.rec::after{content:'';position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--bad);animation:pulse 1.2s ease-out infinite}
.heard{text-align:center;color:var(--muted);min-height:24px;font-size:16px}
.heard b{color:var(--text)}
.wordcard{text-align:center;padding:22px 16px;border:2px solid var(--line);border-radius:22px;background:var(--s1);margin:6px 0 16px}
.wordcard .en{font-size:38px;font-weight:900;letter-spacing:-.02em}
.wordcard .es{font-size:19px;color:var(--muted);margin-top:4px}
.wordcard .ex{margin-top:14px;font-size:16px;line-height:1.45}
.wordcard .ex i{color:var(--muted);font-style:normal;display:block;font-size:14.5px}
.p-foot{padding:14px 18px calc(16px + env(safe-area-inset-bottom));border-top:2px solid var(--line);transition:background .2s}
.p-foot-in{max-width:640px;margin:0 auto}
.p-foot.good{background:var(--goodbg);border-color:transparent}
.p-foot.bad{background:var(--badbg);border-color:transparent}
.fb{display:none;align-items:flex-start;gap:12px;margin-bottom:12px}
.p-foot.good .fb,.p-foot.bad .fb{display:flex}
.fb h4{margin:0;font-size:20px;font-weight:900}
.p-foot.good .fb h4{color:var(--good)}.p-foot.bad .fb h4{color:var(--bad)}
.fb p{margin:3px 0 0;font-size:15.5px;line-height:1.35}
/* resultados */
.result{text-align:center;padding:10px 0}
.result h2{font-size:30px;font-weight:900;margin:8px 0 4px;letter-spacing:-.02em}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.rstat{border:2px solid var(--line);border-radius:18px;padding:12px 6px;background:var(--s1)}
.rstat b{display:block;font-size:24px;font-weight:900}
.rstat span{font-size:12.5px;color:var(--muted);font-weight:700}
.rstat.xp b{color:var(--gold)}.rstat.acc b{color:var(--good)}.rstat.time b{color:var(--blue)}
/* práctica */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile-card{border:1px solid var(--line);background:var(--s1);border-radius:22px;padding:16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:132px;box-shadow:0 4px 0 var(--line);transition:transform .1s}
.tile-card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tile-card .ti{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--s2)}
.tile-card b{font-size:17px;font-weight:800;line-height:1.15}
.tile-card span{font-size:13px;color:var(--muted);line-height:1.3}
.tile-card.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0}
.tile-card.hero{background:var(--chalk);color:var(--onchalk);border-color:var(--chalk);box-shadow:0 4px 0 color-mix(in srgb,var(--chalk) 50%,#000)}
.tile-card.hero span{color:color-mix(in srgb,var(--onchalk) 65%,transparent)}
.tile-card.hero .ti{background:color-mix(in srgb,var(--onchalk) 10%,transparent)}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.msg{max-width:86%;padding:11px 14px;border-radius:18px;font-size:16.5px;line-height:1.4}
.msg.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.msg.kiko{align-self:flex-start;background:var(--s1);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg .tr{display:block;color:var(--muted);font-size:14px;margin-top:6px}
.msg .corr{display:block;margin-top:8px;padding:9px 11px;border-radius:12px;background:var(--badbg);font-size:14.5px}
.msg .corr b{color:var(--bad)}
.msg .ok{display:block;margin-top:6px;color:var(--good);font-weight:800;font-size:14px}
.msg .acts{display:flex;gap:10px;margin-top:6px}
.msg .acts button{border:0;background:none;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;padding:0;display:flex;align-items:center;gap:4px}
.composer{position:sticky;bottom:0;display:flex;gap:8px;align-items:flex-end;padding:10px 0 4px;background:var(--s1)}
.composer textarea{flex:1;border:1px solid var(--line);background:var(--s2);border-radius:16px;padding:12px 14px;font-size:16px;resize:none;outline:none;max-height:120px}
.composer button{width:48px;height:48px;border-radius:16px;border:0;background:var(--chalk);color:var(--onchalk);display:grid;place-items:center;cursor:pointer;flex:none}
.composer button.mic{background:var(--s2);color:var(--text)}
.composer button.mic.rec{background:var(--bad);color:#fff}
.scen{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.scen button{flex:none;border:1px solid var(--line);background:var(--s2);border-radius:99px;padding:8px 13px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--muted)}
.scen button.on{background:var(--chalk);color:var(--onchalk);border-color:var(--chalk)}
/* diccionario */
.search{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:4px 6px 4px 14px;margin-bottom:12px}
.search input{flex:1;border:0;background:transparent;font-size:17px;padding:12px 0;outline:none}
.dres{border:1px solid var(--line);background:var(--s1);border-radius:20px;padding:16px;margin-bottom:10px}
.dres .w{font-size:26px;font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.dres .ph{color:var(--muted);font-size:15px;font-weight:600}
.dres .tr{font-size:18px;font-weight:700;margin:4px 0 8px}
.dres .def{font-size:15px;line-height:1.45;margin:8px 0}
.dres .def em{color:var(--muted);font-style:normal;font-size:13px;font-weight:700;margin-right:6px}
.dres .def i{display:block;color:var(--muted);margin-top:2px}
.dli{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);cursor:pointer}
.dli:first-child{border-top:0}
.dli b{font-size:17px}.dli span{color:var(--muted);font-size:14px}
/* progreso */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:14px}
.kpi b{display:block;font-size:26px;font-weight:900;letter-spacing:-.02em}
.kpi span{font-size:13px;color:var(--muted);font-weight:600}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px;overflow-x:auto;padding:4px 0}
.heat i{width:14px;height:14px;border-radius:4px;background:var(--s3)}
.heat i.l1{background:color-mix(in srgb,var(--good) 35%,var(--s3))}.heat i.l2{background:color-mix(in srgb,var(--good) 65%,var(--s3))}.heat i.l3{background:var(--good)}
.heat i.today{outline:2px solid var(--text);outline-offset:1px}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;margin-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars div i{width:100%;max-width:26px;border-radius:7px 7px 3px 3px;background:var(--gold);transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.bars div span{font-size:11px;color:var(--muted);font-weight:700}
@keyframes grow{from{transform:scaleY(0)}}
.achs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ach{text-align:center;border:1px solid var(--line);border-radius:18px;padding:12px 6px;background:var(--s1)}
.ach .ai{width:46px;height:46px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--s3);color:var(--faint)}
.ach.got .ai{background:var(--gold);color:#3b2c00}
.ach b{display:block;font-size:13px;line-height:1.15}.ach span{font-size:11.5px;color:var(--muted)}
.ach:not(.got){opacity:.6}
.meter{height:10px;border-radius:99px;background:var(--s3);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--gold)}
/* ajustes / listas */
.list{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:2px 16px}
.li{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
.li:first-child{border-top:0}
.li .mid{flex:1;min-width:0}.li .t{font-weight:700}.li .s{font-size:13px;color:var(--muted)}
.tgl{appearance:none;-webkit-appearance:none;width:48px;height:29px;border-radius:99px;background:var(--s3);position:relative;cursor:pointer;flex:none;margin:0;transition:background .2s}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:var(--muted);transition:transform .22s cubic-bezier(.3,1.4,.5,1),background .2s}
.tgl:checked{background:var(--good)}.tgl:checked::after{transform:translateX(19px);background:#fff}
.seg{display:flex;background:var(--s2);border-radius:14px;padding:4px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--s1);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px 2px;font-weight:700}
.field input,.field select{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--s2);font-size:16px;outline:none}
.choice{display:grid;gap:10px}
.choice button{border:2px solid var(--line);background:var(--s1);border-radius:18px;padding:14px 16px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;font-weight:700;box-shadow:0 4px 0 var(--line)}
.choice button.on{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--s1))}
.choice button span{margin-left:auto;color:var(--muted);font-weight:600;font-size:14px}
/* auth / splash / toast / confeti */
.auth{position:fixed;inset:0;z-index:90;display:none;overflow:auto;background:var(--bg)}
.auth.open{display:block}
.auth-box{max-width:420px;margin:auto;min-height:100vh;padding:40px 22px;display:flex;flex-direction:column;justify-content:center}
.auth h1{font-size:48px;font-weight:900;margin:6px 0 0;text-align:center;letter-spacing:-.04em}
.auth .sub{color:var(--muted);margin:8px 0 26px;text-align:center;line-height:1.5}
.err{display:none;background:var(--badbg);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.switch{text-align:center;margin-top:16px;color:var(--muted);font-size:14px}
.linkb{border:0;background:none;color:var(--text);font-weight:800;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
.splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:opacity .4s}
.splash.hide{opacity:0;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--chalk);color:var(--onchalk);border-radius:99px;padding:6px 18px 6px 8px;font-weight:700;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:120;max-width:calc(100% - 32px);display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:110;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:3px;animation:fall 1.7s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.3}}
.fade{animation:fade .3s ease both}@keyframes fade{from{opacity:0;transform:translateY(6px)}}
/* personaje Alex */
.kiko{overflow:visible;display:block;cursor:pointer}
.kiko .kb{transform-box:fill-box;transform-origin:50% 100%;animation:kfloat 3s ease-in-out infinite}
.kiko .ks{transform-box:fill-box;transform-origin:50% 50%;animation:kshadow 3s ease-in-out infinite}
.kiko .wing{transform-box:fill-box;transform-origin:50% 10%}
.kiko .crest{transform-box:fill-box;transform-origin:50% 100%;animation:kcrest 2.4s ease-in-out infinite}
.kiko .glass{transform-box:fill-box;transform-origin:50% 50%;animation:kglass 6s ease-in-out infinite}
.kiko .beak-lo{transform-box:fill-box;transform-origin:20% 0%}
.kiko.m-wave .wing.r{animation:kwave .8s ease-in-out infinite}
.kiko.m-happy .kb{animation:khop .8s cubic-bezier(.3,1.6,.5,1) infinite}
.kiko.m-happy .wing{animation:kflap .25s ease-in-out infinite}
.kiko.m-celebrate .kb{animation:kspin 1.2s cubic-bezier(.3,1.3,.5,1) infinite}
.kiko.m-celebrate .wing{animation:kflap .2s ease-in-out infinite}
.kiko.m-talk .beak-lo{animation:ktalk .28s ease-in-out infinite}
.kiko.m-think .kb{animation:ktilt 2.4s ease-in-out infinite}
.kiko.m-sad .kb{animation:ksad 2.4s ease-in-out infinite}
.kiko.m-sleep .kb{animation:kbreath 4s ease-in-out infinite}
.kiko .z{animation:zz 2.4s ease-in-out infinite;opacity:0}.kiko .z2{animation-delay:.8s}.kiko .z3{animation-delay:1.6s}
.kiko:active .kb{animation:ksquish .35s ease}
@keyframes kfloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes kshadow{0%,100%{transform:scaleX(1);opacity:.3}50%{transform:scaleX(.8);opacity:.18}}
@keyframes kcrest{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
@keyframes kglass{0%,90%,100%{transform:translateY(0)}94%{transform:translateY(-3px)}}
@keyframes kwave{0%,100%{transform:rotate(0)}50%{transform:rotate(-50deg)}}
@keyframes kflap{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg)}}
@keyframes khop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px) scale(1.03,.97)}}
@keyframes kspin{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-16px) rotate(-10deg)}60%{transform:translateY(-16px) rotate(10deg)}}
@keyframes ktalk{0%,100%{transform:rotate(0)}50%{transform:rotate(18deg)}}
@keyframes ktilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes ksad{0%,100%{transform:translateY(2px) rotate(-3deg)}50%{transform:translateY(4px) rotate(3deg)}}
@keyframes kbreath{0%,100%{transform:scale(1)}50%{transform:scale(1.03,.97)}}
@keyframes ksquish{50%{transform:scale(1.12,.86)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-26px) scale(1.1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
div[style*="text-align:center"]>.kiko,.result>.kiko{margin:0 auto}
</style>
